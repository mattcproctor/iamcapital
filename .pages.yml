# Pages CMS (https://app.pagescms.org): the editing screens iAM Capital uses to update the site without code.
# Each save is a commit to this repository, and Cloudflare rebuilds and publishes the site in about two minutes.
# The pages read these files through src/lib/content.ts. Properties, funds and the rest of the site are edited in code.

media:
  - name: documents
    label: Documents (PDF)
    input: public/wp-content/uploads
    output: /wp-content/uploads
    extensions: [pdf]
    rename: safe
  - name: images
    label: Photos
    input: src/assets/uploads
    output: /uploads
    extensions: [jpg, jpeg, png, webp]
    rename: safe

settings:
  commit:
    identity: user

content:
  - name: shareholder-notices
    label: Shareholder notices
    description: Investor Relations page. Newest first on the site, whatever the order here.
    type: file
    path: src/data/shareholder-notices.json
    format: json
    list: true
    fields: &doc-fields
      - name: title
        label: Title
        type: string
        required: true
        description: As shown on the card, e.g. "2026 iAM Notice of AGM".
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
        description: Shown as month and year; the list is sorted by this date.
      - name: pdf
        label: PDF
        type: file
        options:
          media: documents
          path: public/wp-content/uploads/documents
        description: Upload the PDF here. Leave empty if this item is a link instead.
      - name: link
        label: Or a link
        type: string
        description: Only when there is no PDF, e.g. an article on another website ("https://...").

  - name: annual-reports
    label: Annual reports
    description: Investor Relations page. Newest first on the site, whatever the order here.
    type: file
    path: src/data/annual-reports.json
    format: json
    list: true
    fields: *doc-fields

  - name: press
    label: News (press)
    description: News page, Press section. Newest first on the site, whatever the order here.
    type: file
    path: src/data/press.json
    format: json
    list: true
    fields: *doc-fields

  - name: events-news
    label: News (events)
    description: News page, Events section. Newest first on the site, whatever the order here.
    type: file
    path: src/data/events-news.json
    format: json
    list: true
    fields: *doc-fields

  - name: properties
    label: Properties
    description: Each property's page and its pin on the Investments map, in one entry. Saving updates both.
    type: collection
    path: src/data/properties
    format: json
    filename:
      template: "{primary}.json"
      field: create
    view:
      primary: name
      fields: [name, status, city, acquired]
      sort: [name, acquired]
      default:
        sort: acquired
        order: desc
    fields:
      - name: name
        label: Name
        type: string
        required: true
        description: The page heading and the name on the map, e.g. "Castel Porrona". When you create a property, the file name under it becomes the page's web address (castel-porrona → iamcapital.com/castel-porrona/); it can't be changed later.
      - name: listed
        label: Show on the Investments map and list
        type: boolean
        default: true
        description: Switch off to keep the page online without listing it (as for the solar portfolios).
      - name: status
        label: Status
        type: select
        options:
          values: [Active, Sold]
      - name: category
        label: Category
        type: select
        options:
          values: [Residential, Hospitality, Office, Retail, Renewable Energy]
          multiple: true
        description: One or more. Used for the map filters and the card's label, e.g. "Residential & Retail".
      - name: city
        label: City
        type: string
      - name: country
        label: Country
        type: string
        description: In English, e.g. Italy, France, Spain.
      - name: latitude
        label: Map position, latitude
        type: number
        description: In Google Maps, right-click the building and click the two numbers at the top of the menu to copy them. Paste the first number here (e.g. 45.4725) and the second into longitude.
      - name: longitude
        label: Map position, longitude
        type: number
        description: The second number, e.g. 9.2083. (The map shows the pin about half a kilometre off on purpose, so the exact building isn't revealed.)
      - name: size
        label: Size (sqm)
        type: number
        options:
          min: 0
        description: Shown on the map card.
      - name: acquired
        label: Acquired
        type: date
        options:
          format: yyyy-MM
        description: Month of acquisition; any day in the month will do. Shown on the map card as e.g. "Mar-26".
      - name: cover
        label: Banner photo
        type: image
        options:
          media: images
          path: src/assets/uploads/properties
        description: The wide photo at the top of the property's page; a landscape photo works best.
      - name: cardPhoto
        label: Map card photo
        type: image
        options:
          media: images
          path: src/assets/uploads/properties
        description: Optional. The photo on the Investments page card and map pop-up; if empty, the banner photo is used.
      - name: gallery
        label: Photo slider
        type: image
        options:
          media: images
          path: src/assets/uploads/properties
          multiple: true
        description: The photos in the slider on the property's page, in this order.
      - name: description
        label: Description
        type: rich-text
        options:
          format: html
          media: false
        description: The text on the property's page.
      - name: facts
        label: Key facts table
        type: object
        list: true
        description: The table beside the description, one row each, e.g. Acquisition Date / March 2026, Country/city / Milan, Italy, Fund Name / ICE III, Sqm / 1,489, Strategy / Repositioning.
        fields:
          - name: label
            label: Label
            type: string
          - name: value
            label: Value
            type: string
      - name: otherPins
        label: Other investments in the same building
        type: object
        list: true
        description: Rarely needed. A second map card for a separate investment in the same building (e.g. Sirtori, where one part was sold). It shares the position, photo and page above.
        fields:
          - name: status
            label: Status
            type: select
            options:
              values: [Active, Sold]
          - name: category
            label: Category
            type: select
            options:
              values: [Residential, Hospitality, Office, Retail, Renewable Energy]
              multiple: true
          - name: size
            label: Size (sqm)
            type: number
          - name: acquired
            label: Acquired
            type: date
            options:
              format: yyyy-MM
      - name: added
        label: Date added
        type: date
        hidden: true
        options:
          format: yyyy-MM-dd

  - name: team
    label: Team
    description: Team page. People appear in each group in the order of this list (drag to reorder).
    type: file
    path: src/data/team.json
    format: json
    list: true
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: title
        label: Job title
        type: string
        required: true
        description: e.g. "Director" or "Senior Investment Analyst".
      - name: company
        label: Company
        type: string
        description: Optional second line, e.g. "iAM Capital" or "iAM Capital & iAM Invest".
      - name: group
        label: Section
        type: select
        required: true
        options:
          values: [Board of Directors, Investments & Fundraising, Operations]
      - name: photo
        label: Photo
        type: image
        options:
          media: images
          path: src/assets/uploads/team
        description: A portrait, ideally square or taller than wide; it is shown in black and white.
      - name: bio
        label: Biography
        type: rich-text
        options:
          format: html
          media: false
        description: Shown in the pop-up when the card is clicked.

  - name: policies
    label: Policies (legal disclosures)
    description: Responsibility page, Legal Disclosures, in the order of this list.
    type: file
    path: src/data/legal.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: pdf
        label: PDF
        type: file
        required: true
        options:
          media: documents
          path: public/wp-content/uploads/documents
